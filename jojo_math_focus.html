    } else if (action === 'toggle-theme') {
      const order = ['day', 'sunset', 'night'];
      state.theme = order[(order.indexOf(state.theme) + 1) % order.length];
      saveState();
      syncUI();
      showToast(state.theme === 'day' ? '☀️ 陽光森林背景' : state.theme === 'sunset' ? '🌅 粉彩夕陽背景' : '🌙 星空螢火蟲背景');
    } else if (action === 'toggle-sound') {
      state.sound = !state.sound;
      saveState();
      syncUI();
      if (state.sound) playTone(660, 'sine', 0.12);
    } else if (action === 'set-diff') {
      state.diff = btn.dataset.diff;
      saveState();
      syncUI();
      playTone(580, 'sine', 0.1);
    } else if (action === 'start-game') {
      playTone(660, 'triangle', 0.14);
      startGame(btn.dataset.mode);
    } else if (action === 'quit-game') {
      switchTab('home');
    } else if (action === 'close-modal') {
      document.getElementById('result-modal').classList.remove('open');
      switchTab('home');
    } else if (action === 'claim-quest') {
      const q = state.daily.quests.find(item => item.id === btn.dataset.qid);
      if (q && q.prog >= q.target && !q.claimed) {
        q.claimed = true;
        state.coins += q.rewardCoins;
        state.xp += q.rewardXp;
        const pid = state.activePet;
        state.petAffection[pid] = (state.petAffection[pid] || 1) + 1;
        while (state.xp >= state.level * 300) {
          state.xp -= state.level * 300;
          state.level++;
        }
        saveState();
        syncUI();
        playTone(880, 'triangle', 0.2);
        spawnFlyingReward(btn, '🍪');
        const avatar = document.getElementById('home-pet-avatar');
        if (avatar) { avatar.classList.remove('hop'); void avatar.offsetWidth; avatar.classList.add('hop'); }
        showToast(`🎁 任務完成！獲得 +${q.rewardCoins} 🍪 與夥伴親密度 +1！`);
      }
    } else if (action === 'claim-path') {
      const code = btn.dataset.code;
      if ((state.pathProgress[code] || 0) >= 100 && !state.pathClaimed[code]) {
        state.pathClaimed[code] = true;
        state.coins += 50;
        saveState();
        renderPath();
        syncUI();
        playTone(880, 'triangle', 0.2);
        showToast(`🎉 階段 ${code} 達標獎勵 +50 🍪！`);
      }
    } else if (action === 'use-item') {
      if (!game || game.lockedAnswer) return;
      const item = btn.dataset.item;
      if ((state.items[item] || 0) <= 0) {
        showToast('🎒 這個道具用完囉，可到動物小屋補充！');
        return;
      }
      if (item === 'freeze') {
        state.items.freeze--;
        game.frozenUntil = Date.now() + 5000;
        playTone(980, 'sine', 0.2);
        showToast('❄️ 時間凍結！倒數暫停 5 秒鐘');
        updateTimerHUD();
      } else if (item === 'hint') {
        state.items.hint--;
        game.usedHint = true;
        playTone(740, 'triangle', 0.16);
        applyHintEffect(false);
      } else if (item === 'shield') {
        if (game.shieldActive) {
          showToast('🛡️ 目前已經開啟護盾囉！');
          return;
        }
        state.items.shield--;
        game.shieldActive = true;
        playTone(620, 'triangle', 0.18);
        showToast('🛡️ 連擊護盾已啟動！答錯一次不中斷連擊');
        updateComboAndPetHUD();
      }
      updateQuestProgress('q_item_or_rev', 1, false);
      saveState();
      syncUI();
    } else if (action === 'pick-choice') {
      handleAnswer(String(btn.dataset.val) === String(game.currentAns), btn.dataset.val, btn);
    } else if (action === 'key-num') {
      playTone(500, 'sine', 0.08);
      if (game.inputVal.length < 3) {
        game.inputVal += btn.dataset.val;
        const slot = document.getElementById('speed-ans-slot');
        if (slot) slot.textContent = game.inputVal;
      }
    } else if (action === 'key-del') {
      game.inputVal = game.inputVal.slice(0, -1);
      const slot = document.getElementById('speed-ans-slot');
      if (slot) slot.textContent = game.inputVal || '?';
    } else if (action === 'key-ok') {
      if (!game.inputVal) return;
      handleAnswer(game.inputVal === String(game.currentAns), game.inputVal, btn);
    } else if (action === 'toggle-aid') {
      game.showAid = !game.showAid;
      renderSpeedQuestion(document.getElementById('game-stage'));
    } else if (action === 'toggle-hw-input') {
      game.useHandwritingInput = !game.useHandwritingInput;
      renderSpeedQuestion(document.getElementById('game-stage'));
    } else if (action === 'submit-hw-speed') {
      if (hwMetrics.points < 8) { showToast('✍️ 請先在畫布上寫出答案喔！'); return; }
      handleAnswer(true, game.currentAns, btn);
    } else if (action === 'clear-hw') {
      initCanvasDraw(game.mode === 'handwriting' ? game.currentAns : '');
    } else if (action === 'finish-hw') {
      const spanW = hwMetrics.maxX - hwMetrics.minX;
      const spanH = hwMetrics.maxY - hwMetrics.minY;
      if (hwMetrics.points < (game.hwMinPoints || 15) || spanW < 25 || spanH < 20) {
        playTone(240, 'sine', 0.15);
        showToast('✍️ 筆畫還不夠完整喔！請沿著虛線再描仔細一點～');
        return;
      }
      handleAnswer(true, game.currentAns, btn);
    } else if (action === 'speak-word') {
      speakWord(btn.dataset.word);
    } else if (action === 'set-clock-sub') {
      game.clockSubMode = btn.dataset.sub;
      nextQuestion();
    } else if (action === 'toggle-clock-help') {
      game.clockHelp = !game.clockHelp;
      nextQuestion();
    } else if (action === 'adj-dial') {
      const dh = parseInt(btn.dataset.dh, 10);
      const dm = parseInt(btn.dataset.dm, 10);
      let totalM = game.dialH * 60 + game.dialM + dh * 60 + dm;
      totalM = (totalM + 720) % 720;
      game.dialH = Math.floor(totalM / 60) || 12;
      game.dialM = totalM % 60;
      playTone(620, 'sine', 0.08);
      const box = document.getElementById('dial-clock-box');
      if (box) box.innerHTML = buildClockSVG(game.dialH, game.dialM, game.clockHelp);
      const fmt = `${String(game.dialH).padStart(2, '0')}:${String(game.dialM).padStart(2, '0')}`;
      const info = box && box.nextElementSibling;
      if (info) info.textContent = '目前設定：' + fmt;
    } else if (action === 'check-dial') {
      const fmt = `${String(game.dialH).padStart(2, '0')}:${String(game.dialM).padStart(2, '0')}`;
      handleAnswer(fmt === game.currentAns, fmt, btn);
    } else if (action === 'tap-schulte') {
      const num = parseInt(btn.dataset.num, 10);
      if (num === game.schulteNext) {
        playTone(520 + num * 30, 'sine', 0.1);
        btn.classList.remove('hint-pulse');
        btn.classList.add('done');
        game.schulteNext++;
        const t = document.getElementById('schulte-target');
        if (t) t.textContent = game.schulteNext;
        if (game.schulteNext > game.schulteTotal) {
          handleAnswer(true, '完成', btn);
        }
      } else {
        playTone(220, 'sawtooth', 0.15);
        showToast(`👀 要先找數字 ${game.schulteNext} 喔！`);
      }
    } else if (action === 'set-path-subj') {
      state.pathSubj = btn.dataset.subj;
      renderPath();
    } else if (action === 'select-pet') {
      state.activePet = btn.dataset.pet;
      saveState();
      renderPets();
      syncUI();
      playTone(660, 'triangle', 0.14);
    } else if (action === 'unlock-pet') {
      const pet = PETS.find(p => p.id === btn.dataset.pet);
      if (!pet) return;
      if (state.coins < pet.cost) {
        showToast(`🍪 餅乾還差 ${pet.cost - state.coins} 個喔！`);
        return;
      }
      state.coins -= pet.cost;
      state.unlockedPets.push(pet.id);
      state.activePet = pet.id;
      state.petAffection[pet.id] = 1;
      checkAchievements();
      saveState();
      renderPets();
      syncUI();
      playTone(880, 'triangle', 0.2);
      showToast(`🎉 成功領養 ${pet.name}！`);
    } else if (action === 'feed-pet') {
      if (state.coins < 30) {
        showToast('🍪 餅乾不足 30 個，快去玩遊戲賺餅乾吧！');
        return;
      }
      state.coins -= 30;
      const pid = state.activePet;
      state.petAffection[pid] = (state.petAffection[pid] || 1) + 1;
      saveState();
      renderPets();
      syncUI();
      playTone(760, 'triangle', 0.16);
      showToast('🍓 夥伴吃得好開心，親密度提升了！');
    } else if (action === 'buy-items') {
      if (state.coins < 50) {
        showToast('🍪 餅乾不足 50 個喔！');
        return;
      }
      state.coins -= 50;
      state.items.freeze += 1;
      state.items.hint += 1;
      state.items.shield += 1;
      saveState();
      syncUI();
      playTone(720, 'triangle', 0.16);
      showToast('🎒 道具補給完成！凍結/提示/護盾各 +1');
    } else if (action === 'reset-data') {
      localStorage.removeItem('jojo_math_academy_v6');
      state = initFreshState();
      saveState();
      syncUI();
      renderProfile();
      showToast('✅ 存檔已重設為全新狀態！');
    }
  });

  // Boot
  syncUI();
})();
</script>
</body>
</html>
