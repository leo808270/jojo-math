<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>JOJO數學 - 森林小動物專注力學園</title>
<style>
  :root {
    --bg-sky-top: #FFF9EB;
    --bg-sky-mid: #FFEFF5;
    --bg-sky-bot: #E8F9F2;
    --hill-back: #BCEAD5;
    --hill-front: #9ED5C5;
    --card-bg: rgba(255, 255, 255, 0.96);
    --text-main: #4A3B47;
    --text-sub: #7D6B77;
    --accent-pink: #FF6B9D;
    --accent-orange: #FF9F43;
    --accent-yellow: #FECA57;
    --accent-green: #1DD1A1;
    --accent-blue: #54A0FF;
    --accent-purple: #9B59B6;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html {
    font-size: 16px;
    height: 100%;
  }

  @media (min-width: 600px) {
    html { font-size: 18px; }
  }
  @media (min-width: 900px) {
    html { font-size: 19px; }
  }

  body {
    margin: 0;
    padding: 0;
    min-height: 100dvh;
    width: 100%;
    font-family: "Rounded Mplus 1c", "PingFang TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text-main);
    background: linear-gradient(180deg, var(--bg-sky-top) 0%, var(--bg-sky-mid) 52%, var(--bg-sky-bot) 100%);
    overflow-x: hidden;
    position: relative;
  }

  body.theme-sunset {
    --bg-sky-top: #FFE5D9;
    --bg-sky-mid: #FFCAD4;
    --bg-sky-bot: #F4ACB7;
    --hill-back: #D8E2DC;
    --hill-front: #B8C0FF;
  }

  body.theme-night {
    --bg-sky-top: #1E1B3A;
    --bg-sky-mid: #2C2754;
    --bg-sky-bot: #3A336E;
    --hill-back: #283655;
    --hill-front: #1E2942;
    --card-bg: rgba(45, 40, 82, 0.94);
    --text-main: #FFF8F0;
    --text-sub: #D3CBE8;
  }

  /* Isolated Decorative Background */
  .bg-decor {
    position: fixed;
    inset: 0;
    pointer-events: none !important;
    z-index: 0 !important;
    overflow: hidden;
  }

  .sun-rays {
    position: absolute;
    top: -110px;
    right: -90px;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(255, 223, 107, 0.55) 0%, rgba(255, 223, 107, 0) 70%);
    border-radius: 50%;
    animation: pulseSun 6s ease-in-out infinite;
  }

  @keyframes pulseSun {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50% { transform: scale(1.12); opacity: 1; }
  }

  .cloud {
    position: absolute;
    background: rgba(255, 255, 255, 0.72);
    border-radius: 999px;
    filter: blur(1px);
  }
  body.theme-night .cloud { background: rgba(255, 255, 255, 0.12); }

  .hill-layer-1 {
    position: absolute;
    bottom: -40px;
    left: -10%;
    width: 120%;
    height: 160px;
    background: var(--hill-back);
    border-radius: 50% 50% 0 0;
  }

  .hill-layer-2 {
    position: absolute;
    bottom: -60px;
    left: -15%;
    width: 130%;
    height: 140px;
    background: var(--hill-front);
    border-radius: 55% 45% 0 0;
  }

  /* Combo 10 Screen Flash */
  .screen-flash {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle, rgba(255, 234, 167, 0.75), rgba(255, 107, 157, 0.35));
    pointer-events: none !important;
    z-index: 110;
    opacity: 0;
    transition: opacity 0.35s ease-out;
  }
  .screen-flash.active { opacity: 1; }

  /* Flying Reward Particle */
  .fly-reward {
    position: fixed;
    font-size: 1.5rem;
    z-index: 130;
    pointer-events: none !important;
    transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.65s ease-in;
  }

  /* Main Responsive Shell */
  #app-shell {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 840px;
    margin: 0 auto;
    min-height: 100dvh;
    padding-top: calc(var(--safe-top) + 8px);
    padding-bottom: calc(var(--safe-bottom) + 92px);
    padding-left: 12px;
    padding-right: 12px;
    display: block;
  }

  @media (min-width: 600px) {
    #app-shell {
      padding-left: 22px;
      padding-right: 22px;
      padding-bottom: calc(var(--safe-bottom) + 105px);
    }
  }

  /* Touch-safe buttons */
  button {
    font-family: inherit;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    border: none;
    outline: none;
  }
  button * {
    pointer-events: none;
  }

  /* Top Status Bar */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-bottom: 10px;
    flex-wrap: nowrap;
  }

  .brand-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--card-bg);
    padding: 6px 11px;
    border-radius: 999px;
    box-shadow: 0 3px 0 rgba(255, 107, 157, 0.2);
    border: 2px solid #FFD6E5;
    font-weight: 800;
    font-size: 0.92rem;
    white-space: nowrap;
  }

  .lv-badge {
    background: linear-gradient(135deg, #A29BFE, #6C5CE7);
    color: #fff;
    padding: 2px 7px;
    border-radius: 999px;
    font-size: 0.76rem;
  }

  .stat-group {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .stat-pill {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--card-bg);
    padding: 5px 9px;
    border-radius: 999px;
    font-weight: 800;
    font-size: 0.84rem;
    box-shadow: 0 3px 0 rgba(0, 0, 0, 0.06);
    border: 2px solid #FFEAA7;
    white-space: nowrap;
  }

  .icon-btn {
    width: 38px;
    height: 38px;
    min-width: 38px;
    border-radius: 50%;
    background: var(--card-bg);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.05rem;
    box-shadow: 0 3px 0 rgba(0, 0, 0, 0.08);
    border: 2px solid #F1F2F6;
    transition: transform 0.12s;
  }
  .icon-btn:active { transform: translateY(2px) scale(0.95); }

  /* Strict Block Vertical Flow for Views */
  .app-main {
    display: block;
    width: 100%;
  }

  .view-pane {
    display: none;
    width: 100%;
  }
  .view-pane.active {
    display: block;
  }

  /* Companion Banner */
  .companion-card {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    background: var(--card-bg);
    border-radius: 22px;
    padding: 11px 14px;
    margin-bottom: 10px;
    border: 2.5px dashed #FFB8D0;
    box-shadow: 0 5px 0 rgba(255, 184, 208, 0.32);
  }

  .pet-avatar-wrap {
    position: relative;
    width: 62px;
    height: 62px;
    min-width: 62px;
    background: #FFF3F8;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #FFD1E3;
    transition: transform 0.2s;
  }
  .pet-avatar-wrap.hop {
    animation: petHop 0.5s ease;
  }
  @keyframes petHop {
    0%, 100% { transform: translateY(0) scale(1); }
    40% { transform: translateY(-10px) scale(1.12); }
    70% { transform: translateY(2px) scale(0.95); }
  }

  .pet-lv-tag {
    position: absolute;
    bottom: -6px;
    background: #FF6B9D;
    color: #fff;
    font-size: 0.68rem;
    font-weight: 800;
    padding: 1px 7px;
    border-radius: 999px;
  }

  .companion-info {
    flex: 1;
    min-width: 0;
  }

  .companion-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-bottom: 4px;
  }

  .pet-name {
    font-weight: 900;
    font-size: 0.96rem;
    color: #E84393;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .pet-skill-tag {
    font-size: 0.7rem;
    font-weight: 800;
    color: #0984E3;
    background: #E8F4FD;
    padding: 2px 7px;
    border-radius: 999px;
    margin-bottom: 4px;
    display: inline-block;
  }

  .switch-pet-btn {
    background: #FFF0F6;
    color: #D63031;
    border: 1.5px solid #FFCCE0;
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 0.76rem;
    font-weight: 800;
    min-height: 30px;
    white-space: nowrap;
  }

  .pet-speech {
    background: #F8F9FA;
    color: #57606F;
    border-radius: 12px;
    padding: 4px 9px;
    font-size: 0.78rem;
    font-weight: 700;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  body.theme-night .pet-speech {
    background: rgba(255,255,255,0.1);
    color: #F5F6FA;
  }

  .xp-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.74rem;
    font-weight: 800;
    color: var(--text-sub);
  }

  .xp-bar-bg {
    flex: 1;
    height: 8px;
    background: #ECEFF4;
    border-radius: 999px;
    overflow: hidden;
  }
  .xp-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #FF9F43, #FF6B9D, #54A0FF);
    border-radius: 999px;
    transition: width 0.3s ease;
  }

  /* Daily Quests Panel */
  .quest-box {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 10px 12px;
    margin-bottom: 10px;
    border: 2px solid #FFEAA7;
    box-shadow: 0 4px 0 rgba(253, 203, 110, 0.25);
  }
  .quest-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.84rem;
    font-weight: 900;
    margin-bottom: 6px;
    color: #B36B00;
  }
  body.theme-night .quest-header { color: #FFEAA7; }

  .quest-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 12px;
    background: rgba(255, 249, 235, 0.7);
    margin-bottom: 5px;
    font-size: 0.78rem;
    font-weight: 800;
  }
  body.theme-night .quest-row { background: rgba(255, 255, 255, 0.08); }
  .quest-row:last-child { margin-bottom: 0; }

  .quest-claim-btn {
    padding: 4px 10px;
    min-height: 28px;
    border-radius: 999px;
    font-size: 0.74rem;
    font-weight: 900;
    background: #DFE4EA;
    color: #747D8C;
    white-space: nowrap;
  }
  .quest-claim-btn.ready {
    background: linear-gradient(180deg, #55EFC4, #00B894);
    color: #fff;
    animation: pulseClaim 1.2s infinite;
  }
  .quest-claim-btn.claimed {
    background: transparent;
    color: #1DD1A1;
  }
  @keyframes pulseClaim {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  /* Difficulty Strip */
  .diff-strip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    width: 100%;
    background: var(--card-bg);
    padding: 7px 10px;
    border-radius: 16px;
    margin-bottom: 10px;
    box-shadow: 0 3px 0 rgba(0, 0, 0, 0.05);
  }

  .diff-label {
    font-size: 0.8rem;
    font-weight: 800;
    color: var(--text-sub);
    white-space: nowrap;
  }

  .diff-btns {
    display: flex;
    gap: 6px;
    flex: 1;
    justify-content: flex-end;
  }

  .diff-btn {
    padding: 6px 12px;
    min-height: 36px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 0.82rem;
    background: #F1F2F6;
    color: #57606F;
    border-bottom: 3px solid #DFE4EA;
  }
  .diff-btn.active {
    background: linear-gradient(180deg, #FFEAA7, #FDCB6E);
    color: #7F5500;
    border-bottom-color: #E1B12C;
  }

  /* Section Title */
  .sec-heading {
    font-size: 0.86rem;
    font-weight: 900;
    color: var(--text-sub);
    margin: 4px 2px 7px 2px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* Uniform 3-Column Equal-Size Card Rows */
  .uniform-row-3 {
    display: flex;
    flex-direction: row;
    gap: 8px;
    width: 100%;
    margin-bottom: 8px;
  }

  @media (min-width: 600px) {
    .uniform-row-3 { gap: 12px; margin-bottom: 12px; }
  }

  .uniform-card {
    flex: 1 1 0%;
    width: 0;
    min-width: 0;
    height: 106px;
    background: var(--card-bg);
    border-radius: 18px;
    padding: 8px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    text-align: center;
    position: relative;
    border: 2px solid #F1F2F6;
    border-bottom-width: 4px;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.04);
    transition: transform 0.12s;
  }
  .uniform-card:active {
    transform: translateY(2px) scale(0.97);
  }

  @media (min-width: 600px) {
    .uniform-card {
      height: 126px;
      padding: 12px 10px;
      border-radius: 22px;
    }
  }

  .card-top-meta {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.66rem;
    font-weight: 800;
    color: var(--text-sub);
    line-height: 1;
  }

  .card-tag {
    background: rgba(0, 0, 0, 0.05);
    padding: 2px 5px;
    border-radius: 6px;
    white-space: nowrap;
  }
  body.theme-night .card-tag { background: rgba(255,255,255,0.12); }

  .card-best {
    white-space: nowrap;
  }

  .card-icon-pill {
    width: 52px;
    height: 36px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
    color: #fff;
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.45), 0 3px 0 rgba(0,0,0,0.12);
  }

  @media (min-width: 600px) {
    .card-icon-pill {
      width: 64px;
      height: 44px;
      font-size: 1.45rem;
    }
  }

  .card-title {
    font-size: 0.86rem;
    font-weight: 900;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
    line-height: 1.15;
  }

  .badge-float {
    position: absolute;
    top: -6px;
    right: -4px;
    background: #FF4757;
    color: #fff;
    font-size: 0.62rem;
    font-weight: 900;
    padding: 2px 6px;
    border-radius: 999px;
    box-shadow: 0 2px 4px rgba(255, 71, 87, 0.4);
  }

  /* Card Accent Borders & Icon Pill Colors */
  .c-clock { border-color: #70A1FF; border-bottom-color: #1E90FF; }
  .c-clock .card-icon-pill { background: linear-gradient(180deg, #54A0FF, #2E86DE); }

  .c-write { border-color: #FECA57; border-bottom-color: #FF9F43; }
  .c-write .card-icon-pill { background: linear-gradient(180deg, #FECA57, #FF9F43); }

  .c-review { border-color: #FF7675; border-bottom-color: #D63031; }
  .c-review .card-icon-pill { background: linear-gradient(180deg, #FF7675, #E17055); }

  .c-speed { border-color: #A29BFE; border-bottom-color: #6C5CE7; }
  .c-speed .card-icon-pill { background: linear-gradient(180deg, #A29BFE, #6C5CE7); }

  .c-schulte { border-color: #FAB1A0; border-bottom-color: #E17055; }
  .c-schulte .card-icon-pill { background: linear-gradient(180deg, #FF9F43, #EE5253); }

  .c-memory { border-color: #55EFC4; border-bottom-color: #00B894; }
  .c-memory .card-icon-pill { background: linear-gradient(180deg, #1DD1A1, #10AC84); }

  .c-distract { border-color: #74B9FF; border-bottom-color: #0984E3; }
  .c-distract .card-icon-pill { background: linear-gradient(180deg, #48DBFB, #0ABDE3); }

  .c-match { border-color: #FD79A8; border-bottom-color: #E84393; }
  .c-match .card-icon-pill { background: linear-gradient(180deg, #FF6B81, #EE5253); }

  .c-oddone { border-color: #FFEAA7; border-bottom-color: #FDCB6E; }
  .c-oddone .card-icon-pill { background: linear-gradient(180deg, #FECA57, #FF9F43); }

  .c-balance { border-color: #81ECEC; border-bottom-color: #00CEC9; }
  .c-balance .card-icon-pill { background: linear-gradient(180deg, #1DD1A1, #00B894); }

  .c-train { border-color: #82CCDD; border-bottom-color: #3C6382; }
  .c-train .card-icon-pill { background: linear-gradient(180deg, #54A0FF, #341F97); }

  .c-whack { border-color: #FFCCCC; border-bottom-color: #FF6B81; }
  .c-whack .card-icon-pill { background: linear-gradient(180deg, #FF9FF3, #F368E0); }

  /* Bottom Navigation */
  .bottom-nav {
    position: fixed;
    bottom: calc(var(--safe-bottom) + 8px);
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 20px);
    max-width: 720px;
    background: var(--card-bg);
    border-radius: 999px;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    box-shadow: 0 8px 24px rgba(74, 59, 71, 0.16);
    border: 2.5px solid #FFD6E5;
    z-index: 50;
  }

  .nav-btn {
    flex: 1;
    min-height: 48px;
    border-radius: 999px;
    background: transparent;
    color: var(--text-sub);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-size: 0.74rem;
    font-weight: 800;
    transition: all 0.15s;
  }
  .nav-btn .nav-ico { font-size: 1.15rem; }
  .nav-btn.active {
    background: linear-gradient(180deg, #FFF0F6, #FFE3EE);
    color: #E84393;
    box-shadow: inset 0 1px 0 #fff, 0 2px 0 #FFB8D0;
  }

  /* Game Stage Overlay / View */
  .game-hud {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    background: var(--card-bg);
    padding: 8px 10px;
    border-radius: 18px;
    margin-bottom: 8px;
    border: 2px solid #FFD6E5;
    box-shadow: 0 4px 0 rgba(0, 0, 0, 0.05);
  }

  .quit-btn {
    background: #FFF0F3;
    color: #E84393;
    border: 1.5px solid #FFC2D4;
    border-radius: 12px;
    padding: 6px 10px;
    min-height: 38px;
    font-weight: 900;
    font-size: 0.82rem;
    white-space: nowrap;
  }

  .timer-pill {
    display: flex;
    align-items: center;
    gap: 4px;
    background: #FFF8E7;
    border: 2px solid #FECA57;
    color: #B36B00;
    padding: 4px 10px;
    border-radius: 999px;
    font-weight: 900;
    font-size: 0.9rem;
    white-space: nowrap;
  }
  .timer-pill.urgent {
    background: #FFE5E5;
    border-color: #FF4757;
    color: #D63031;
    animation: shakeMild 0.4s infinite;
  }
  .timer-pill.frozen {
    background: #E0F7FA;
    border-color: #00CEC9;
    color: #00838F;
  }

  @keyframes shakeMild {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-2px); }
    75% { transform: translateX(2px); }
  }

  .hud-metrics {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 900;
    font-size: 0.84rem;
  }

  .combo-chip {
    background: #FF9F43;
    color: #fff;
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 0.78rem;
    transition: all 0.2s;
  }
  .combo-chip.tier2 { background: linear-gradient(90deg, #FF6B6B, #FF9F43); }
  .combo-chip.tier3 { background: linear-gradient(90deg, #6C5CE7, #E84393); }
  .combo-chip.tier4 { background: linear-gradient(90deg, #FF6B9D, #FECA57, #1DD1A1); color: #2D3436; }

  /* Random Stage Event Banner */
  .event-banner {
    background: linear-gradient(90deg, #FFF3BF, #FFE8CC);
    border: 2px solid #FFA94D;
    color: #8C4A00;
    border-radius: 14px;
    padding: 6px 12px;
    margin-bottom: 8px;
    font-size: 0.82rem;
    font-weight: 900;
    text-align: center;
    display: none;
  }
  .event-banner.active { display: block; }
  .event-banner.boss {
    background: linear-gradient(90deg, #FFE3E3, #FFC9C9);

  /* Companion Live Reaction Strip in Game */

  .time-progress-wrap {
    width: 100%;
    height: 8px;
    background: rgba(255, 255, 255, 0.7);

    overflow: hidden;
    margin-bottom: 8px;
    border: 1px solid #FFD6E5;
  }
  .time-progress-bar {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #1DD1A1, #FECA57, #FF6B9D);
    transition: width 0.2s linear;
  }

  .game-arena {
    width: 100%;
    background: var(--card-bg);
    border-radius: 24px;
    padding: 14px;

  /* Powerups Bar */
  .powerups-bar {
    display: flex;
    gap: 8px;
    width: 100%;
  }

  .powerup-btn {
    flex: 1;
    min-height: 46px;
    border-radius: 16px;
    background: var(--card-bg);
    border: 2px solid #DFE4EA;
    border-bottom-width: 4px;
    font-weight: 800;
    font-size: 0.8rem;
    color: var(--text-main);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .powerup-btn:active { transform: translateY(2px); }
  .powerup-btn.active-shield {
    border-color: #1DD1A1;
    background: #E6FCF5;
    color: #087F5B;
  }

  /* Keypad & Options */
  .keypad-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 12px;
  }
  .key-btn {
    min-height: 52px;
    border-radius: 16px;
    font-size: 1.3rem;
    font-weight: 900;
    background: #FFF9FB;
    color: var(--text-main);
    border: 2px solid #FFD6E5;
    border-bottom: 4px solid #FFB8D0;
  }
  body.theme-night .key-btn {
    background: #3B346E;
    border-color: #574B90;
    border-bottom-color: #2C2754;
  }
  .key-btn:active { transform: translateY(2px); }
  .key-btn.del { background: #FFEAA7; border-color: #FDCB6E; color: #7F5500; }
  .key-btn.ok { background: #55EFC4; border-color: #00B894; color: #004D3D; }

  .choice-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 12px;
  }
  .choice-pill {
    width: 100%;
    min-height: 54px;
    border-radius: 999px;
    font-size: 1.22rem;
    font-weight: 900;
    color: #2D3436;
    border: 2.5px solid rgba(0, 0, 0, 0.08);
    border-bottom-width: 5px;
    transition: all 0.15s;
  }
  .choice-pill:active { transform: translateY(2px); }
  .choice-pill.c0 { background: linear-gradient(180deg, #D6EAFF, #AED6FF); border-bottom-color: #54A0FF; }
  .choice-pill.c1 { background: linear-gradient(180deg, #FFF3BF, #FFE066); border-bottom-color: #FECA57; }
  .choice-pill.c2 { background: linear-gradient(180deg, #FFD8E8, #FFB3D1); border-bottom-color: #FF6B9D; }
  .choice-pill.c3 { background: linear-gradient(180deg, #D3F9D8, #96F2D7); border-bottom-color: #1DD1A1; }
  .choice-pill.eliminated {
    opacity: 0.25;
    pointer-events: none;
    text-decoration: line-through;
  }
  .choice-pill.correct-glow {
    background: linear-gradient(180deg, #69DB7C, #38D9A9) !important;
    border-color: #2B8A3E !important;
    color: #fff !important;
    transform: scale(1.03);
  }
  .choice-pill.wrong-shake {
    background: linear-gradient(180deg, #FFA8A8, #FF6B6B) !important;
    border-color: #C92A2A !important;
    color: #fff !important;
  }

  /* Feedback Inline Card */
  .feedback-callout {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 16px;
    background: #FFF5F5;
    border: 2px solid #FFA8A8;
    color: #C92A2A;
    font-size: 0.86rem;
    font-weight: 800;
    text-align: center;
  }

  /* Clock Module Styles */
  .clock-subtabs {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }
  .clock-tab {
    flex: 1;
    min-height: 40px;
    border-radius: 14px;
    font-size: 0.8rem;
    font-weight: 800;
    background: #F1F2F6;
    color: #57606F;
    border-bottom: 3px solid #DFE4EA;
  }
  .clock-tab.active {
    background: #54A0FF;
    color: #fff;
    border-bottom-color: #2E86DE;
  }

  .clock-controls-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .clock-svg-box {
    width: 260px;
    height: 260px;
    margin: 4px auto 10px auto;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }
  @media (min-width: 600px) {
    .clock-svg-box {
      width: 350px;
      height: 350px;
    }
  }

  .dial-btns-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin-top: 8px;
  }
  .dial-adj-btn {
    min-height: 44px;
    padding: 6px 12px;
    border-radius: 14px;
    font-weight: 900;
    font-size: 0.86rem;
    background: #E8F4FD;
    color: #0984E3;
    border: 2px solid #74B9FF;
    border-bottom-width: 4px;
  }

  /* Schulte & Match & OddOne Grids */
  .schulte-grid {
    display: grid;
    gap: 8px;
    margin: 10px auto;
    max-width: 380px;
  }
  .schulte-cell {
    aspect-ratio: 1 / 1;
    min-height: 50px;
    border-radius: 16px;
    font-size: 1.25rem;
    font-weight: 900;
    background: #FFF5E4;
    color: #6D4C41;
    border: 2px solid #FFCC80;
    border-bottom-width: 4px;
  }
  .schulte-cell.done {
    background: #C8E6C9;
    border-color: #81C784;
    color: #2E7D32;
    opacity: 0.55;
  }
  .schulte-cell.hint-pulse {
    border-color: #FF4757;
    background: #FFE3E3;
    animation: pulseClaim 0.8s infinite;
  }

  /* Canvas Handwriting */
  .hw-canvas-wrap {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 210px;
    margin: 10px auto;
    background: #FFFDF9;
    border: 3px dashed #FECA57;
    border-radius: 20px;
    overflow: hidden;
    touch-action: none;
  }
  .hw-canvas {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }

  /* Visual Aids (Apples & Blocks) */
  .visual-aid-box {
    background: #FFF9EC;
    border: 2px solid #FFEAA7;
    border-radius: 16px;
    padding: 8px 10px;
    margin: 8px 0;
    font-size: 1.15rem;
    line-height: 1.4;
    text-align: center;
  }
  body.theme-night .visual-aid-box {
    background: rgba(255, 255, 255, 0.1);
    color: #FFF8F0;
  }

  /* Learning Path Cards */
  .path-node {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 14px;
    margin-bottom: 10px;
    border: 2.5px solid #BDE0FE;
    border-bottom-width: 5px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .path-node.completed {
    border-color: #55EFC4;
    border-bottom-color: #00B894;
  }
  .path-badge {
    width: 52px;
    height: 52px;
    min-width: 52px;
    border-radius: 16px;
    background: linear-gradient(135deg, #FF9F43, #FF6B9D);
    color: #fff;
    font-weight: 900;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Pet House & Profile Cards */
  .pet-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  @media (min-width: 600px) {
    .pet-grid { grid-template-columns: repeat(3, 1fr); }
  }
  .pet-item-card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 12px;
    text-align: center;
    border: 2.5px solid #FFD6E5;
    border-bottom-width: 4px;
  }
  .pet-item-card.selected {
    border-color: #FF6B9D;
    background: #FFF5F8;
  }
  body.theme-night .pet-item-card.selected {
    background: rgba(255, 107, 157, 0.2);
  }

  /* Badges Grid */
  .badge-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 10px;
  }
  .ach-card {
    background: rgba(0, 0, 0, 0.03);
    border: 2px solid #ECEFF4;
    border-radius: 16px;
    padding: 8px 6px;
    text-align: center;
    opacity: 0.45;
  }
  .ach-card.unlocked {
    opacity: 1;
    background: #FFF9EB;
    border-color: #FECA57;
  }
  body.theme-night .ach-card.unlocked {
    background: rgba(254, 202, 87, 0.16);
  }

  /* Result Stamp & Modal */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(30, 27, 58, 0.55);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-backdrop.open {
    display: flex;
  }
  .modal-card {
    width: 100%;
    max-width: 430px;
    background: var(--card-bg);
    border-radius: 28px;
    padding: 20px 18px;
    text-align: center;
    border: 3px solid #FFD6E5;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
  }

  .rank-medal {
    width: 78px;
    height: 78px;
    margin: 4px auto 8px auto;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.3rem;
    font-weight: 900;
    color: #fff;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15);
  }
  .rank-S { background: linear-gradient(135deg, #FECA57, #FF6B9D); }
  .rank-A { background: linear-gradient(135deg, #54A0FF, #5F27CD); }
  .rank-B { background: linear-gradient(135deg, #1DD1A1, #10AC84); }
  .rank-C { background: linear-gradient(135deg, #A4B0BE, #747D8C); }

  .report-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin: 10px 0;
    text-align: center;
  }
  .report-cell {
    background: rgba(0, 0, 0, 0.04);
    border-radius: 14px;
    padding: 8px;
    font-size: 0.82rem;
    font-weight: 800;
  }
  body.theme-night .report-cell { background: rgba(255, 255, 255, 0.08); }

  .stamp-100 {
    width: 96px;
    height: 96px;
    margin: 8px auto;
    border-radius: 50%;
    border: 5px double #FF4757;
    color: #FF4757;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    transform: rotate(-12deg);
    animation: stampPop 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes stampPop {
    0% { transform: scale(2.4) rotate(-25deg); opacity: 0; }
    100% { transform: scale(1) rotate(-12deg); opacity: 1; }
  }

  .primary-action-btn {
    width: 100%;
    min-height: 50px;
    border-radius: 16px;
    background: linear-gradient(180deg, #FF7EB3, #FF6B9D);
    color: #fff;
    font-size: 1rem;
    font-weight: 900;
    border-bottom: 4px solid #D63068;
    margin-top: 8px;
  }

  .floating-toast {
    position: fixed;
    top: 64px;
    left: 50%;
    transform: translateX(-50%);
    background: #2D3436;
    color: #fff;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.84rem;
    font-weight: 800;
    z-index: 120;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    white-space: nowrap;
  }
  .floating-toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="bg-decor">
  <div class="sun-rays"></div>
  <div class="cloud" style="top: 55px; left: 8%; width: 110px; height: 34px;"></div>
  <div class="cloud" style="top: 105px; right: 10%; width: 130px; height: 38px;"></div>
  <div class="hill-layer-1"></div>
  <div class="hill-layer-2"></div>
</div>

<div id="screen-flash" class="screen-flash"></div>
<div id="toast" class="floating-toast"></div>

<div id="app-shell">
  <!-- Top Status Bar -->
  <header class="top-bar">
    <div class="brand-pill">
      <span>🐾 JOJO數學</span>

    <div class="stat-group">

      <button class="icon-btn" data-action="toggle-theme" title="切換日夜背景">☀️</button>
      <button class="icon-btn" data-action="toggle-sound" id="btn-sound" title="音效開關">🔊</button>
    </div>
  </header>

  <main class="app-main">
    <!-- TAB 1: HOME TRAINING -->
    <section id="view-home" class="view-pane active">
      <!-- Companion Card -->
      <div class="companion-card">
        <div class="pet-avatar-wrap" id="home-pet-avatar">
          <span style="font-size:2.1rem;">🐼</span>
          <span class="pet-lv-tag" id="home-pet-lv">Lv.1</span>
        </div>
        <div class="companion-info">
          <div class="companion-top">
            <span class="pet-name" id="home-pet-name">JOJO 小熊貓</span>

            <span id="home-xp-text">60/300</span>

        </div>
      </div>

      <!-- Daily Quests -->
      <div class="quest-box">
        <div class="quest-header">
          <span>📋 今日森林小任務</span>
          <span id="quest-date-tag" style="font-size:0.74rem; opacity:0.8;">每日更新</span>

        <div id="daily-quests-list"></div>

      <!-- Difficulty Strip -->
      <div class="diff-strip">
        <span class="diff-label">🎯 難度分級</span>

          <button class="diff-btn active" data-action="set-diff" data-diff="easy">🌱 簡單</button>
          <button class="diff-btn" data-action="set-diff" data-diff="medium">🌿 進階</button>
          <button class="diff-btn" data-action="set-diff" data-diff="hard">🔥 挑戰</button>
        </div>
      </div>

      <!-- Special Learning Features (Equal 3-Column Row) -->
      <div class="sec-heading">
        <span>✨ 特色互動學堂（每題 30 秒）</span>
        <span>均等大卡片</span>
      </div>
      <div class="uniform-row-3">
        <button class="uniform-card c-clock" data-action="start-game" data-mode="clock">
          <span class="badge-float">NEW</span>
          <div class="card-top-meta">
            <span class="card-tag">時鐘小達人</span>
            <span class="card-best">🏆<span id="best-clock">0</span></span>
          </div>
          <div class="card-icon-pill">🕐</div>
          <div class="card-title">認識鐘表</div>
        </button>

        <button class="uniform-card c-write" data-action="start-game" data-mode="handwriting">
          <div class="card-top-meta">
            <span class="card-tag">數/英四線格</span>
            <span class="card-best">🏆<span id="best-handwriting">0</span></span>
          </div>
          <div class="card-icon-pill">✍️</div>
          <div class="card-title">手寫描字</div>

        <button class="uniform-card c-review" data-action="start-game" data-mode="review">
          <span class="badge-float" id="wrong-count-badge" style="display:none;">0</span>
          <div class="card-top-meta">
            <span class="card-tag">鬧鐘複習</span>
            <span class="card-best">🏆<span id="best-review">0</span></span>

          <div class="card-icon-pill">⏰</div>
          <div class="card-title">錯題訂正</div>

      <!-- 9 Focus Modes (3 Uniform Rows x 3 Equal Cards) -->
      <div class="sec-heading">
        <span>🎮 九大專注力訓練關卡</span>
        <span>⏱️ 30s / 題</span>
      </div>

      <div class="uniform-row-3">
        <button class="uniform-card c-speed" data-action="start-game" data-mode="speed">
          <div class="card-top-meta">
            <span class="card-tag">教具/心算</span>
            <span class="card-best">🏆<span id="best-speed">0</span></span>
          </div>
          <div class="card-icon-pill">⚡</div>
          <div class="card-title">閃電速算</div>
        </button>

        <button class="uniform-card c-schulte" data-action="start-game" data-mode="schulte">
          <div class="card-top-meta">
            <span class="card-tag">視覺搜尋</span>
            <span class="card-best">🏆<span id="best-schulte">0</span></span>
          </div>
          <div class="card-icon-pill">🍪</div>
          <div class="card-title">舒爾特餅乾</div>

        <button class="uniform-card c-memory" data-action="start-game" data-mode="memory">
          <div class="card-top-meta">
            <span class="card-tag">工作記憶</span>
            <span class="card-best">🏆<span id="best-memory">0</span></span>

          <div class="card-icon-pill">🧠</div>
          <div class="card-title">記憶算式</div>

      <div class="uniform-row-3">

            <span class="card-tag">抗干擾力</span>
            <span class="card-best">🏆<span id="best-distract">0</span></span>
          </div>
          <div class="card-icon-pill">🐝</div>
          <div class="card-title">蜜蜂抗干擾</div>
        </button>

        <button class="uniform-card c-match" data-action="start-game" data-mode="match">
          <div class="card-top-meta">
            <span class="card-tag">湊十配對</span>
            <span class="card-best">🏆<span id="best-match">0</span></span>
          </div>
          <div class="card-icon-pill">🍬</div>
          <div class="card-title">果凍消消樂</div>
        </button>

        <button class="uniform-card c-oddone" data-action="start-game" data-mode="oddone">
          <div class="card-top-meta">
            <span class="card-tag">細節辨識</span>
            <span class="card-best">🏆<span id="best-oddone">0</span></span>
          </div>
          <div class="card-icon-pill">🔍</div>
          <div class="card-title">算式找碴</div>
        </button>
      </div>

      <div class="uniform-row-3">
        <button class="uniform-card c-balance" data-action="start-game" data-mode="balance">
          <div class="card-top-meta">
            <span class="card-tag">重量平衡</span>
            <span class="card-best">🏆<span id="best-balance">0</span></span>
          </div>
          <div class="card-icon-pill">⚖️</div>
          <div class="card-title">森林天平</div>
        </button>

        <button class="uniform-card c-train" data-action="start-game" data-mode="train">
          <div class="card-top-meta">
            <span class="card-tag">數列規律</span>
            <span class="card-best">🏆<span id="best-train">0</span></span>
          </div>
          <div class="card-icon-pill">🚂</div>
          <div class="card-title">數字小火車</div>
        </button>

        <button class="uniform-card c-whack" data-action="start-game" data-mode="whack">
          <div class="card-top-meta">
            <span class="card-tag">反應抑制</span>
            <span class="card-best">🏆<span id="best-whack">0</span></span>
          </div>
          <div class="card-icon-pill">🔨</div>
          <div class="card-title">打地鼠任務</div>
        </button>
      </div>
    </section>

    <!-- TAB 2: LEARNING PATH -->
    <section id="view-path" class="view-pane">
      <div class="game-arena">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <h3 style="margin:0; font-size:1.05rem;">🗺️ 客製化階梯學習路徑</h3>
          <div style="display:flex; gap:6px;">
            <button class="diff-btn active" data-action="set-path-subj" data-subj="math">📐 數學</button>
            <button class="diff-btn" data-action="set-path-subj" data-subj="eng">🔤 英文拼讀</button>

        <div style="font-size:0.78rem; color:var(--text-sub); margin-bottom:10px; font-weight:700;">
          完成對應關卡即可累積進度（滿 100% 自動領取 50 🍪 達標獎勵）

    <section id="view-pets" class="view-pane">

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">

      <div class="game-arena" id="game-stage"></div>

      <div class="powerups-bar">
        <button class="powerup-btn" id="btn-item-freeze" data-action="use-item" data-item="freeze">❄️ 凍結 (<span id="item-freeze">2</span>)</button>
        <button class="powerup-btn" id="btn-item-hint" data-action="use-item" data-item="hint">💡 提示 (<span id="item-hint">2</span>)</button>

  <!-- Bottom 4-Tab Navigation -->

    <button class="nav-btn active" data-action="nav" data-tab="home">
      <span class="nav-ico">🎮</span>

    <button class="nav-btn" data-action="nav" data-tab="path">

      <span>學習路徑</span>

    <button class="nav-btn" data-action="nav" data-tab="pets">
      <span class="nav-ico">🏡</span>
      <span>動物小屋</span>
    </button>
    <button class="nav-btn" data-action="nav" data-tab="profile">
      <span class="nav-ico">📊</span>
      <span>成長成就</span>

  </nav>

<!-- Round Over Modal -->
<div id="result-modal" class="modal-backdrop">
  <div class="modal-card">
    <div id="result-stamp-area"></div>
    <h2 id="result-title" style="margin:4px 0;">訓練完成！</h2>
    <p id="result-desc" style="color:var(--text-sub); font-weight:700; font-size:0.86rem; margin:4px 0 8px 0;"></p>
    <div class="report-grid" id="result-report-grid"></div>
    <button class="primary-action-btn" data-action="close-modal">回到學園首頁</button>
  </div>
</div>

<script>
(function() {
  'use strict';

  const BASE_QUESTION_SECONDS = 30;

  const PETS = [
    { id: 'panda', name: 'JOJO 小熊貓', emoji: '🐼', cost: 0, skill: '每局首錯保留連擊', quote: '「啾啾～每題都有 30 秒，看清楚再出手喔！」' },
    { id: 'chick', name: '披風小雞隊長', emoji: '🐥', cost: 120, skill: '錯題訂正經驗 +50%', quote: '「滴滴！我們一起把錯題全部訂正成 100 分！」' },
    { id: 'bunny', name: '麻糬小兔', emoji: '🐰', cost: 180, skill: '認識鐘表每題多 +3 秒', quote: '「跳跳～時鐘的短針看小時、長針看分鐘喔！」' },
    { id: 'shiba', name: '布丁小柴犬', emoji: '🐶', cost: 250, skill: '通關餅乾獎勵 +20%', quote: '「汪汪！專注力滿分，餅乾獎勵拿不完！」' },
    { id: 'seal', name: '泡泡小海豹', emoji: '🦭', cost: 320, skill: '最後 5 秒倒數減速一半', quote: '「呼嚕～心平氣和，最後幾秒也能穩穩算完！」' },
    { id: 'hedgehog', name: '奇異果小刺蝟', emoji: '🦔', cost: 400, skill: '舒爾特/找碴開局免費提示', quote: '「沙沙～細心觀察每一個數字與算式細節！」' }
  ];

  const ACHIEVEMENTS = [
    { id: 'first10', ico: '🌟', title: '初試啼聲', desc: '累積答對 10 題' },
    { id: 'combo8', ico: '⚡', title: '超專注狀態', desc: '單局連續答對 8 題' },
    { id: 'allmodes', ico: '🎮', title: '全能小玩家', desc: '體驗全部 12 種模式' },
    { id: 'rev10', ico: '⏰', title: '訂正小達人', desc: '完成 5 題錯題訂正' },
    { id: 'nohint', ico: '🧠', title: '獨立思考王', desc: '不使用提示完成一局' },
    { id: 'streak3', ico: '🔥', title: '三日好習慣', desc: '連續登入 3 天' },
    { id: 'pets3', ico: '🐾', title: '森林好朋友', desc: '收集 3 隻以上寵物' },
    { id: 'clutch', ico: '⏱️', title: '壓秒神射手', desc: '在最後 5 秒答對題目' },
    { id: 'score1k', ico: '👑', title: '千分王者', desc: '任一模式突破 1,000 分' }
  ];

  const PATH_NODES = {
    math: [
      { code: 'A1', title: '認識 1～10 與蘋果計數', mode: 'speed' },
      { code: 'A2', title: '合十的方法與湊十消消樂', mode: 'match' },
      { code: 'B1', title: '認識鐘表：整點與半點', mode: 'clock' },
      { code: 'B2', title: '加減進退位與天平平衡', mode: 'balance' },
      { code: 'C1', title: '手寫數字筆畫專注力小考', mode: 'handwriting' }
    ],
    eng: [
      { code: 'E1', title: '自然發音 /c/ /a/ /t/ 拼寫', mode: 'handwriting' },
      { code: 'E2', title: '水果單字 banana 描寫', mode: 'handwriting' },
      { code: 'E3', title: '英文時間 O'clock 認識鐘表', mode: 'clock' }
    ]
  };

  function getTodayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  const DEFAULT_STATE = {
    coins: 200,
    xp: 60,
    level: 1,
    streak: 1,
    lastPlayDate: '',
    sound: true,
    theme: 'day',
    diff: 'easy',
    activePet: 'panda',
    unlockedPets: ['panda'],
    petAffection: { panda: 1 },
    items: { freeze: 2, hint: 2, shield: 2 },
    best: {
      clock: 0, handwriting: 0, review: 0,
      speed: 0, schulte: 0, memory: 0,
      distract: 0, match: 0, oddone: 0,
      balance: 0, train: 0, whack: 0
    },
    playedModes: [],
    totalCorrect: 0,
    totalReviewed: 0,
    unlockedAch: [],
    wrongBank: [
      { q: '16 + 2 = ?', ans: '18', user: '19', tip: '先算個位數 6 + 2 = 8，再加上 10 喔！' },
      { q: '12 + 8 = ?', ans: '20', user: '21', tip: '2 和 8 剛好湊成 10，10 + 10 = 20！' }
    ],
    pathSubj: 'math',
    pathProgress: { A1: 40, A2: 20, B1: 0, B2: 0, C1: 0, E1: 30, E2: 0, E3: 0 },
    pathClaimed: {},
    daily: {
      date: '',
      quests: []
    }
  };

  let state = loadState();

  function generateDailyQuests(today) {
    return [
      { id: 'q_games', title: '完成 2 局專注訓練', target: 2, prog: 0, rewardCoins: 40, rewardXp: 60, claimed: false },
      { id: 'q_combo', title: '單局達成 5 連擊', target: 5, prog: 0, rewardCoins: 50, rewardXp: 80, claimed: false },
      { id: 'q_item_or_rev', title: '使用 1 次道具或完成 1 題訂正', target: 1, prog: 0, rewardCoins: 45, rewardXp: 70, claimed: false }
    ];
  }

  function loadState() {
    try {
      const raw = localStorage.getItem('jojo_math_academy_v6');
      if (!raw) return initFreshState();
      const parsed = JSON.parse(raw);
      const merged = Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), parsed, {
        best: Object.assign({}, DEFAULT_STATE.best, parsed.best || {}),
        items: Object.assign({}, DEFAULT_STATE.items, parsed.items || {}),
        pathProgress: Object.assign({}, DEFAULT_STATE.pathProgress, parsed.pathProgress || {}),
        pathClaimed: parsed.pathClaimed || {}
      });
      ensureDailyQuests(merged);
      return merged;
    } catch (e) {
      return initFreshState();
    }
  }

  function initFreshState() {
    const s = JSON.parse(JSON.stringify(DEFAULT_STATE));
    ensureDailyQuests(s);
    return s;
  }

  function ensureDailyQuests(s) {
    const today = getTodayStr();
    if (!s.daily || s.daily.date !== today || !Array.isArray(s.daily.quests) || s.daily.quests.length === 0) {
      s.daily = {
        date: today,
        quests: generateDailyQuests(today)
      };
    }
  }

  function saveState() {
    try {
      localStorage.setItem('jojo_math_academy_v6', JSON.stringify(state));
    } catch (e) {}
  }

  // Daily Streak Check on Play Completion
  function updateDailyStreak() {
    const today = getTodayStr();
    if (state.lastPlayDate === today) return false;

    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    const yStr = `${yesterday.getFullYear()}-${String(yesterday.getMonth() + 1).padStart(2, '0')}-${String(yesterday.getDate()).padStart(2, '0')}`;

    if (state.lastPlayDate === yStr) {
      state.streak += 1;
    } else {
      state.streak = 1;
    }
    state.lastPlayDate = today;

    if (state.streak === 3 || state.streak === 7 || state.streak === 14) {
      state.coins += 80;
      showToast(`🔥 連續學習 ${state.streak} 天達成！額外獲得 +80 🍪`);
    }
    return true;
  }

  function updateQuestProgress(questId, amount, isMaxMode) {
    ensureDailyQuests(state);
    const q = state.daily.quests.find(item => item.id === questId);
    if (!q || q.claimed) return;
    if (isMaxMode) {
      q.prog = Math.max(q.prog, Math.min(q.target, amount));
    } else {
      q.prog = Math.min(q.target, q.prog + amount);
    }
  }

  function checkAchievements(extra) {
    const unlock = (id) => {
      if (!state.unlockedAch.includes(id)) {
        state.unlockedAch.push(id);
        const info = ACHIEVEMENTS.find(a => a.id === id);
        if (info) showToast(`🏅 解鎖新徽章：【${info.title}】！`);
      }
    };
    if (state.totalCorrect >= 10) unlock('first10');
    if (extra && extra.maxCombo >= 8) unlock('combo8');
    if (state.playedModes.length >= 12) unlock('allmodes');
    if (state.totalReviewed >= 5) unlock('rev10');
    if (extra && extra.usedHint === false && extra.correctCount >= 5) unlock('nohint');
    if (state.streak >= 3) unlock('streak3');
    if (state.unlockedPets.length >= 3) unlock('pets3');
    if (extra && extra.clutchHit) unlock('clutch');
    if (Object.values(state.best).some(v => v >= 1000)) unlock('score1k');
  }

  // Audio Helper
  let audioCtx = null;
  function playTone(freq, type, dur) {
    if (!state.sound) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (dur || 0.16));
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + (dur || 0.16));
    } catch (e) {}
  }

  function speakWord(text) {
    try {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = 0.85;
        window.speechSynthesis.speak(u);
      }
    } catch (e) {}
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._tid);
    t._tid = setTimeout(() => t.classList.remove('show'), 2100);
  }

  function spawnFlyingReward(sourceEl, emoji) {
    try {
      const target = document.getElementById('coin-target-pill');
      if (!target) return;
      const startRect = sourceEl ? sourceEl.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight / 2 };
      const endRect = target.getBoundingClientRect();

      const el = document.createElement('div');
      el.className = 'fly-reward';
      el.textContent = emoji || '🍪';
      el.style.left = startRect.left + 'px';
      el.style.top = startRect.top + 'px';
      document.body.appendChild(el);

      requestAnimationFrame(() => {
        const dx = endRect.left - startRect.left;
        const dy = endRect.top - startRect.top;
        el.style.transform = `translate(${dx}px, ${dy}px) scale(0.5)`;
        el.style.opacity = '0.2';
      });
      setTimeout(() => el.remove(), 700);
    } catch (e) {}
  }

  function triggerScreenFlash() {
    const fl = document.getElementById('screen-flash');
    fl.classList.add('active');
    setTimeout(() => fl.classList.remove('active'), 420);
  }

  // Render UI
  function syncUI() {
    ensureDailyQuests(state);
    document.getElementById('ui-lv').textContent = 'Lv.' + state.level;
    document.getElementById('ui-coins').textContent = state.coins;
    document.getElementById('ui-streak').textContent = state.streak;
    document.getElementById('btn-sound').textContent = state.sound ? '🔊' : '🔇';

    document.body.classList.remove('theme-sunset', 'theme-night');
    if (state.theme === 'sunset') document.body.classList.add('theme-sunset');
    if (state.theme === 'night') document.body.classList.add('theme-night');

    const pet = PETS.find(p => p.id === state.activePet) || PETS[0];
    document.getElementById('home-pet-avatar').innerHTML =
      `<span style="font-size:2.1rem;">${pet.emoji}</span><span class="pet-lv-tag">Lv.${state.petAffection[pet.id] || 1}</span>`;
    document.getElementById('home-pet-name').textContent = pet.name;
    document.getElementById('home-pet-skill').textContent = '✨ 技能：' + pet.skill;
    document.getElementById('home-pet-speech').textContent = pet.quote;

    const ranks = ['森林見習生', '專注小尖兵', '算術小博士', '森林守護者', '傳說大導師'];
    document.getElementById('home-rank').textContent = ranks[Math.min(ranks.length - 1, Math.floor((state.level - 1) / 2))];

    const needXp = state.level * 300;
    const pct = Math.min(100, Math.round((state.xp / needXp) * 100));
    document.getElementById('home-xp-bar').style.width = pct + '%';
    document.getElementById('home-xp-text').textContent = `${state.xp}/${needXp}`;

    renderDailyQuests();

    document.querySelectorAll('[data-action="set-diff"]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.diff === state.diff);
    });

    Object.keys(state.best).forEach(k => {
      const el = document.getElementById('best-' + k);
      if (el) el.textContent = state.best[k];
    });

    const wb = document.getElementById('wrong-count-badge');
    if (state.wrongBank.length > 0) {
      wb.style.display = 'inline-block';
      wb.textContent = state.wrongBank.length;
    } else {
      wb.style.display = 'none';
    }

    document.getElementById('item-freeze').textContent = state.items.freeze;
    document.getElementById('item-hint').textContent = state.items.hint;
    document.getElementById('item-shield').textContent = state.items.shield;
  }

  function renderDailyQuests() {
    const list = document.getElementById('daily-quests-list');
    document.getElementById('quest-date-tag').textContent = state.daily.date;
    list.innerHTML = state.daily.quests.map(q => {
      const done = q.prog >= q.target;
      let btnHtml = '';
      if (q.claimed) {
        btnHtml = `<span class="quest-claim-btn claimed">✓ 已領獎</span>`;
      } else if (done) {
        btnHtml = `<button class="quest-claim-btn ready" data-action="claim-quest" data-qid="${q.id}">領取 +${q.rewardCoins}🍪</button>`;
      } else {
        btnHtml = `<span class="quest-claim-btn">${q.prog}/${q.target}</span>`;
      }
      return `
        <div class="quest-row">
          <span>${done ? '🌟' : '🔸'} ${q.title}</span>
          ${btnHtml}
        </div>
      `;
    }).join('');
  }

  function switchTab(tab) {
    stopGameTimer();
    document.querySelectorAll('.view-pane').forEach(v => v.classList.remove('active'));
    document.getElementById('bottom-nav').style.display = 'flex';
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));

    const target = document.getElementById('view-' + tab);
    if (target) target.classList.add('active');

    if (tab === 'path') renderPath();
    if (tab === 'pets') renderPets();
    if (tab === 'profile') renderProfile();
    syncUI();
  }

  function renderPath() {
    const c = document.getElementById('path-list-container');
    const subj = state.pathSubj;
    document.querySelectorAll('[data-action="set-path-subj"]').forEach(b => {
      b.classList.toggle('active', b.dataset.subj === subj);
    });
    const nodes = PATH_NODES[subj] || PATH_NODES.math;

    c.innerHTML = nodes.map(n => {
      const prog = Math.min(100, state.pathProgress[n.code] || 0);
      const isDone = prog >= 100;
      const claimed = !!state.pathClaimed[n.code];
      let actionBtn = `<button class="switch-pet-btn" data-action="start-game" data-mode="${n.mode}">開始練習</button>`;
      if (isDone && !claimed) {
        actionBtn = `<button class="quest-claim-btn ready" data-action="claim-path" data-code="${n.code}">領 +50🍪</button>`;
      } else if (isDone && claimed) {
        actionBtn = `<button class="switch-pet-btn" data-action="start-game" data-mode="${n.mode}">✓ 已通關</button>`;
      }
      return `
        <div class="path-node ${isDone ? 'completed' : ''}">
          <div class="path-badge">${n.code}</div>
          <div style="flex:1; min-width:0;">
            <div style="font-weight:900; font-size:0.92rem; margin-bottom:4px;">${n.title} (${prog}%)</div>
            <div class="xp-bar-bg"><div class="xp-bar-fill" style="width:${prog}%;"></div></div>
          </div>
          ${actionBtn}
        </div>
      `;
    }).join('');
  }

  function renderPets() {
    const c = document.getElementById('pet-grid-container');
    c.innerHTML = PETS.map(p => {
      const unlocked = state.unlockedPets.includes(p.id);
      const selected = state.activePet === p.id;
      return `
        <div class="pet-item-card ${selected ? 'selected' : ''}">
          <div style="font-size:2.5rem; margin-bottom:2px;">${p.emoji}</div>
          <div style="font-weight:900; font-size:0.9rem;">${p.name}</div>
          <div style="font-size:0.72rem; color:#0984E3; font-weight:800; margin:2px 0;">✨ ${p.skill}</div>
          <div style="font-size:0.72rem; color:var(--text-sub); margin:2px 0 8px 0;">
            ${unlocked ? '親密度 Lv.' + (state.petAffection[p.id] || 1) : '需要 ' + p.cost + ' 🍪'}
          </div>
          ${unlocked
            ? `<button class="switch-pet-btn" style="width:100%;" data-action="select-pet" data-pet="${p.id}">${selected ? '✓ 陪伴中' : '選為夥伴'}</button>`
            : `<button class="diff-btn active" style="width:100%;" data-action="unlock-pet" data-pet="${p.id}">解鎖領養</button>`
          }
        </div>
      `;
    }).join('');
  }

  function renderProfile() {
    const box = document.getElementById('stats-summary-box');
    const totalBest = Object.values(state.best).reduce((a, b) => a + b, 0);
    box.innerHTML = `
      <div class="stat-pill" style="justify-content:center; padding:12px;">🏆 總最高分：${totalBest}</div>
      <div class="stat-pill" style="justify-content:center; padding:12px;">✅ 累積答對：${state.totalCorrect} 題</div>
      <div class="stat-pill" style="justify-content:center; padding:12px;">🐾 夥伴數：${state.unlockedPets.length}/${PETS.length}</div>
      <div class="stat-pill" style="justify-content:center; padding:12px;">🔥 連續學習：${state.streak} 天</div>
    `;

    document.getElementById('ach-count').textContent = state.unlockedAch.length;
    const achGrid = document.getElementById('ach-grid-container');
    achGrid.innerHTML = ACHIEVEMENTS.map(a => {
      const ok = state.unlockedAch.includes(a.id);
      return `
        <div class="ach-card ${ok ? 'unlocked' : ''}">
          <div style="font-size:1.6rem;">${a.ico}</div>
          <div style="font-weight:900; font-size:0.76rem; margin:2px 0;">${a.title}</div>
          <div style="font-size:0.66rem; color:var(--text-sub);">${a.desc}</div>
        </div>
      `;
    }).join('');
  }

  // Active Game Engine
  let game = null;
  let timerInterval = null;

  function stopGameTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }

  function getQuestionDuration() {
    if (!game) return BASE_QUESTION_SECONDS;
    if (game.eventType === 'rainbow') return 12;
    let sec = BASE_QUESTION_SECONDS;
    if (state.activePet === 'bunny' && game.mode === 'clock') sec += 3;
    return sec;
  }

  function resetQuestionTimer() {
    if (!game) return;
    game.maxTime = getQuestionDuration();
    game.timeLeft = game.maxTime;
    game.frozenUntil = 0;
    game.qStartTime = Date.now();
    updateTimerHUD();
  }

  function updateTimerHUD() {
    if (!game) return;
    const pill = document.getElementById('game-timer-pill');
    const val = document.getElementById('game-timer-val');
    const bar = document.getElementById('game-time-bar');
    const isFrozen = Date.now() < game.frozenUntil;

    val.textContent = Math.max(0, Math.ceil(game.timeLeft));
    bar.style.width = Math.max(0, (game.timeLeft / game.maxTime) * 100) + '%';

    pill.classList.remove('urgent', 'frozen');
    if (isFrozen) pill.classList.add('frozen');
    else if (game.timeLeft <= 6) pill.classList.add('urgent');
  }

  function updateComboAndPetHUD() {
    if (!game) return;
    const chip = document.getElementById('game-combo-chip');
    const pet = PETS.find(p => p.id === state.activePet) || PETS[0];
    document.getElementById('game-pet-ico').textContent = pet.emoji;
    const lineEl = document.getElementById('game-pet-line');

    chip.classList.remove('tier2', 'tier3', 'tier4');
    if (game.combo >= 10) {
      chip.classList.add('tier4');
      chip.textContent = `🌈 ${game.combo} 彩虹極限!`;
      lineEl.textContent = `「太神啦！${pet.name} 進入傳說彩虹專注狀態！」`;
    } else if (game.combo >= 8) {
      chip.classList.add('tier3');
      chip.textContent = `⚡ ${game.combo} 超專注`;
      lineEl.textContent = `「再兩題就能發動彩虹閃光獎勵囉！」`;
    } else if (game.combo >= 5) {
      chip.classList.add('tier2');
      chip.textContent = `🔥 ${game.combo} 專注火焰`;
      lineEl.textContent = `「進入心流狀態了！速度又快又準！」`;
    } else if (game.combo >= 3) {
      chip.textContent = `✨ ${game.combo} 小小連擊`;
      lineEl.textContent = `「好棒的節奏！繼續保持專注喔～」`;
    } else {
      chip.textContent = `🔥 ${game.combo}`;
      lineEl.textContent = pet.quote;
    }

    const shieldBtn = document.getElementById('btn-item-shield');
    if (shieldBtn) shieldBtn.classList.toggle('active-shield', game.shieldActive);
  }

  function rollStageEvent() {
    game.eventType = null;
    const banner = document.getElementById('game-event-banner');
    banner.className = 'event-banner';

    if (game.mode === 'review') return;

    if (game.qIndex === game.totalQ - 1) {
      game.eventType = 'boss';
      banner.className = 'event-banner active boss';
      banner.textContent = '👑 最終 BOSS 題！答對獲得 3 倍超高分數！';
      return;
    }

    if (game.qIndex > 0 && game.qIndex % 3 === 1) {
      const pool = [
        { id: 'lucky', text: '🍀 幸運餅乾事件：本題答對獲得雙倍餅乾！' },
        { id: 'pethelp', text: '🐾 寵物神助攻：夥伴幫你刪掉一個錯誤選項！' },
        { id: 'rainbow', text: '🌈 彩虹閃電題：限時 12 秒，答對分數翻倍！' },
        { id: 'silent', text: '🌲 安靜森林考驗：本題靜音倒數，考驗內在專注！' }
      ];
      const chosen = pool[Math.floor(Math.random() * pool.length)];
      game.eventType = chosen.id;
      banner.className = 'event-banner active';
      banner.textContent = chosen.text;
    }
  }

  function startGame(mode) {
    stopGameTimer();
    if (!state.playedModes.includes(mode)) {
      state.playedModes.push(mode);
      saveState();
    }

    document.querySelectorAll('.view-pane').forEach(v => v.classList.remove('active'));
    document.getElementById('bottom-nav').style.display = 'none';
    document.getElementById('view-game').classList.add('active');

    game = {
      mode: mode,
      score: 0,
      combo: 0,
      maxCombo: 0,
      correctCount: 0,
      totalResponseSec: 0,
      qIndex: 0,
      totalQ: mode === 'review' ? Math.max(1, state.wrongBank.length) : 8,
      maxTime: BASE_QUESTION_SECONDS,
      timeLeft: BASE_QUESTION_SECONDS,
      frozenUntil: 0,
      shieldActive: false,
      pandaFreeSaveUsed: false,
      usedHint: false,
      clutchHit: false,
      lockedAnswer: false,
      inputVal: '',
      showAid: true,
      useHandwritingInput: false,
      clockSubMode: 'read',
      clockHelp: true,
      dialH: 3,
      dialM: 0,
      currentAns: null,
      currentQuestionText: '',
      currentTip: '',
      eventType: null
    };

    document.getElementById('game-score').textContent = '0';
    updateComboAndPetHUD();

    timerInterval = setInterval(() => {
      if (!game || game.lockedAnswer) return;
      if (Date.now() < game.frozenUntil) {
        updateTimerHUD();
        return;
      }
      const tickRate = (state.activePet === 'seal' && game.timeLeft <= 5) ? 0.125 : 0.25;
      game.timeLeft -= tickRate;
      updateTimerHUD();
      if (game.timeLeft <= 0) {
        onTimeOutQuestion();
      }
    }, 250);

    nextQuestion();
  }

  function onTimeOutQuestion() {
    if (game.lockedAnswer) return;
    game.lockedAnswer = true;
    if (game.eventType !== 'silent') playTone(220, 'sawtooth', 0.25);
    showToast(`⏰ 時間到！正確答案是 ${game.currentAns}`);
    game.combo = 0;
    updateComboAndPetHUD();

    setTimeout(() => {
      if (!game) return;
      game.qIndex++;
      if (game.qIndex >= game.totalQ) finishGame();
      else nextQuestion();
    }, 1100);
  }

  function handleAnswer(isCorrect, userGiven, clickedBtnEl) {
    if (!game || game.lockedAnswer) return;
    game.lockedAnswer = true;

    const elapsed = Math.max(1, (Date.now() - game.qStartTime) / 1000);
    game.totalResponseSec += elapsed;

    if (isCorrect) {
      if (game.eventType !== 'silent') {
        playTone(660, 'triangle', 0.13);
        setTimeout(() => playTone(880, 'triangle', 0.15), 85);
      }
      if (clickedBtnEl) clickedBtnEl.classList.add('correct-glow');
      spawnFlyingReward(clickedBtnEl, game.eventType === 'lucky' ? '🍀' : '⭐');

      game.combo++;
      game.maxCombo = Math.max(game.maxCombo, game.combo);
      game.correctCount++;
      state.totalCorrect++;

      if (game.timeLeft <= 5) game.clutchHit = true;

      let mult = 1;
      if (game.eventType === 'boss') mult = 3;
      else if (game.eventType === 'rainbow') mult = 2;

      const bonus = (100 + game.combo * 15 + Math.round(game.timeLeft * 2)) * mult;
      game.score += bonus;
      document.getElementById('game-score').textContent = game.score;

      if (game.eventType === 'lucky') {
        state.coins += 15;
        showToast(`🍀 幸運餅乾雙倍！+${bonus} 分 & +15 🍪`);
      } else if (game.combo === 10) {
        triggerScreenFlash();
        state.coins += 25;
        showToast(`🌈 10 連擊彩虹爆發！額外 +25 🍪`);
      } else {
        showToast(`✨ 答對了！+${bonus} 分`);
      }

      updateComboAndPetHUD();
      updateQuestProgress('q_combo', game.combo, true);

      if (game.mode === 'review' && state.wrongBank.length > 0) {
        state.wrongBank.shift();
        state.totalReviewed++;
        updateQuestProgress('q_item_or_rev', 1, false);
      }
      saveState();

      setTimeout(() => {
        if (!game) return;
        game.qIndex++;
        if (game.qIndex >= game.totalQ) finishGame();
        else nextQuestion();
      }, 650);
    } else {
      let comboSaved = false;
      if (game.shieldActive) {
        game.shieldActive = false;
        comboSaved = true;
      } else if (state.activePet === 'panda' && !game.pandaFreeSaveUsed && game.combo > 0) {
        game.pandaFreeSaveUsed = true;
        comboSaved = true;
      }

      if (game.eventType !== 'silent') playTone(200, 'sawtooth', 0.24);
      if (clickedBtnEl) clickedBtnEl.classList.add('wrong-shake');

      document.querySelectorAll('.choice-pill').forEach(b => {
        if (String(b.dataset.val) === String(game.currentAns)) {
          b.classList.add('correct-glow');
        }
      });

      if (!comboSaved) {
        game.combo = 0;
      }
      updateComboAndPetHUD();

      const stage = document.getElementById('game-stage');
      const tipText = game.currentTip || `正確答案是 ${game.currentAns}，下次再注意細節喔！`;
      const callout = document.createElement('div');
      callout.className = 'feedback-callout';
      callout.innerHTML = `
        <div>💡 差一點點！正確答案是 <b>${game.currentAns}</b> ${comboSaved ? '（🛡️ 夥伴護盾保住了連擊！）' : ''}</div>
        <div style="font-size:0.78rem; margin-top:3px; color:#57606F;">${tipText}</div>
      `;
      stage.appendChild(callout);

      if (game.mode !== 'review' && game.currentQuestionText) {
        state.wrongBank.push({
          q: game.currentQuestionText,
          ans: String(game.currentAns),
          user: String(userGiven || '?'),
          tip: tipText
        });
        if (state.wrongBank.length > 15) state.wrongBank.shift();
        saveState();
      }

      setTimeout(() => {
        if (!game) return;
        game.qIndex++;
        if (game.qIndex >= game.totalQ) finishGame();
        else nextQuestion();
      }, 1550);
    }
  }

  function finishGame() {
    stopGameTimer();
    const acc = Math.round((game.correctCount / game.totalQ) * 100);
    const avgSec = (game.totalResponseSec / game.totalQ).toFixed(1);

    let grade = 'C';
    if (acc >= 90 && game.score >= 850) grade = 'S';
    else if (acc >= 75) grade = 'A';
    else if (acc >= 50) grade = 'B';

    let earnedCoins = Math.max(15, Math.round(game.score / 25));
    if (state.activePet === 'shiba') earnedCoins = Math.round(earnedCoins * 1.2);

    let earnedXp = Math.max(35, Math.round(game.score / 11));
    if (state.activePet === 'chick' && game.mode === 'review') earnedXp = Math.round(earnedXp * 1.5);

    state.coins += earnedCoins;
    state.xp += earnedXp;
    while (state.xp >= state.level * 300) {
      state.xp -= state.level * 300;
      state.level++;
    }

    const prevBest = state.best[game.mode] || 0;
    const isNewRecord = game.score > prevBest;
    if (isNewRecord) {
      state.best[game.mode] = game.score;
    }

    const allNodes = [...PATH_NODES.math, ...PATH_NODES.eng];
    allNodes.forEach(n => {
      if (n.mode === game.mode) {
        const gain = acc >= 80 ? 25 : (acc >= 60 ? 15 : 5);
        state.pathProgress[n.code] = Math.min(100, (state.pathProgress[n.code] || 0) + gain);
      }
    });

    updateDailyStreak();
    updateQuestProgress('q_games', 1, false);
    checkAchievements({
      maxCombo: game.maxCombo,
      usedHint: game.usedHint,
      correctCount: game.correctCount,
      clutchHit: game.clutchHit
    });
    saveState();

    const stampArea = document.getElementById('result-stamp-area');
    if (game.mode === 'review') {
      stampArea.innerHTML = `<div class="stamp-100"><span style="font-size:0.65rem;">JO MATH</span><span style="font-size:1.6rem;">100</span><span style="font-size:0.65rem;">訂正滿分</span></div>`;
      document.getElementById('result-title').textContent = '錯題訂正大成功！';
      document.getElementById('result-desc').textContent = '所有錯題都重新學會了，獲得 100 分紅印章！';
    } else {
      stampArea.innerHTML = `<div class="rank-medal rank-${grade}">${grade}</div>`;
      document.getElementById('result-title').textContent = isNewRecord ? '🎉 突破個人最高紀錄！' : '專注力訓練報告';
      document.getElementById('result-desc').textContent = isNewRecord
        ? `比上次紀錄（${prevBest} 分）進步了 +${game.score - prevBest} 分！`
        : `距離個人紀錄（${prevBest} 分）越來越近囉！`;
    }

    document.getElementById('result-report-grid').innerHTML = `
      <div class="report-cell">⭐ 本局得分：<b>${game.score}</b></div>
      <div class="report-cell">🎯 正確率：<b>${acc}%</b></div>
      <div class="report-cell">🔥 最高連擊：<b>${game.maxCombo}</b></div>
      <div class="report-cell">⏱️ 平均作答：<b>${avgSec}s</b></div>
      <div class="report-cell">🍪 獲得餅乾：<b>+${earnedCoins}</b></div>
      <div class="report-cell">✨ 獲得經驗：<b>+${earnedXp}</b></div>
    `;

    if (isNewRecord || grade === 'S') {
      playTone(523, 'triangle', 0.12);
      setTimeout(() => playTone(659, 'triangle', 0.12), 110);
      setTimeout(() => playTone(784, 'triangle', 0.2), 220);
    }

    document.getElementById('result-modal').classList.add('open');
    game = null;
    syncUI();
  }

  // Question Generators
  function nextQuestion() {
    resetQuestionTimer();
    game.lockedAnswer = false;
    game.inputVal = '';
    rollStageEvent();
    updateComboAndPetHUD();

    const stage = document.getElementById('game-stage');
    const m = game.mode;

    if (m === 'clock') renderClockQuestion(stage);
    else if (m === 'handwriting') renderHandwritingQuestion(stage);
    else if (m === 'review') renderReviewQuestion(stage);
    else if (m === 'schulte') renderSchulteQuestion(stage);
    else if (m === 'memory') renderMemoryQuestion(stage);
    else if (m === 'distract') renderDistractQuestion(stage);
    else if (m === 'match') renderMatchQuestion(stage);
    else if (m === 'oddone') renderOddOneQuestion(stage);
    else if (m === 'balance') renderBalanceQuestion(stage);
    else if (m === 'train') renderTrainQuestion(stage);
    else if (m === 'whack') renderWhackQuestion(stage);
    else renderSpeedQuestion(stage);

    if (state.activePet === 'hedgehog' && (m === 'schulte' || m === 'oddone')) {
      applyHintEffect(true);
    }
    if (game.eventType === 'pethelp') {
      applyHintEffect(true);
    }
  }

  function applyHintEffect(isFree) {
    if (!game) return;
    const choices = Array.from(document.querySelectorAll('.choice-pill:not(.eliminated)'));
    const wrongChoices = choices.filter(b => String(b.dataset.val) !== String(game.currentAns));
    if (wrongChoices.length > 1) {
      const target = wrongChoices[Math.floor(Math.random() * wrongChoices.length)];
      target.classList.add('eliminated');
      if (!isFree) showToast('💡 已幫你刪去一個錯誤選項！');
      return true;
    }
    if (game.mode === 'schulte') {
      const cell = document.querySelector(`.schulte-cell[data-num="${game.schulteNext}"]`);
      if (cell) {
        cell.classList.add('hint-pulse');
        if (!isFree) showToast(`💡 下一個數字 ${game.schulteNext} 正在閃爍喔！`);
        return true;
      }
    }
    if (!isFree) {
      showToast(`💡 提示：${game.currentTip || '仔細檢查十位數與個位數喔！'}`);
    }
    return true;
  }

  // 1. SPEED MATH
  function renderSpeedQuestion(stage) {
    const maxN = state.diff === 'easy' ? 12 : (state.diff === 'medium' ? 35 : 80);
    const isAdd = Math.random() > 0.4;
    let a = Math.floor(Math.random() * maxN) + 2;
    let b = Math.floor(Math.random() * Math.min(20, maxN)) + 1;
    if (!isAdd && a < b) [a, b] = [b, a];
    const ans = isAdd ? a + b : a - b;
    const op = isAdd ? '+' : '-';

    game.currentAns = String(ans);
    game.currentQuestionText = `${a} ${op} ${b} = ?`;
    game.currentTip = isAdd ? `先算個位數 ${a % 10} + ${b % 10}，有滿 10 要進位喔！` : `從 ${a} 往回數 ${b} 個就是答案囉！`;

    let visualHtml = '';
    if (game.showAid && a <= 25 && b <= 15) {
      if (isAdd) {
        const tens = Math.floor(ans / 10);
        const ones = ans % 10;
        visualHtml = `<div class="visual-aid-box">🧱 十位積木：${'🟨'.repeat(tens) || '無'} ｜ 個位：${'🟦'.repeat(ones) || '無'}</div>`;
      } else {
        const stay = '🍎'.repeat(ans);
        const gone = '🍏'.repeat(b);
        visualHtml = `<div class="visual-aid-box">${stay}${gone}<div style="font-size:0.75rem; color:var(--text-sub);">紅蘋果留下、青蘋果拿走 ${b} 顆</div></div>`;
      }
    }

    stage.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <span style="font-weight:800; font-size:0.82rem; color:var(--text-sub);">第 ${game.qIndex + 1} / ${game.totalQ} 題</span>
        <div style="display:flex; gap:6px;">
          <button class="switch-pet-btn" data-action="toggle-aid">🍎 具象教具</button>
          <button class="switch-pet-btn" data-action="toggle-hw-input">${game.useHandwritingInput ? '🔢 數字鍵盤' : '✍️ 手寫作答'}</button>
        </div>
      </div>
      <div style="text-align:center; font-size:2.2rem; font-weight:900; margin:10px 0;">
        ${a} ${op} ${b} = <span id="speed-ans-slot" style="color:#E84393; border-bottom:3px solid #E84393; padding:0 12px;">?</span>
      </div>
      ${visualHtml}
      ${game.useHandwritingInput ? `
        <div class="hw-canvas-wrap"><canvas id="hw-canvas" class="hw-canvas"></canvas></div>
        <div style="display:flex; gap:8px;">
          <button class="diff-btn" style="flex:1;" data-action="clear-hw">🧹 清除重寫</button>
          <button class="primary-action-btn" style="flex:2; margin-top:0;" data-action="submit-hw-speed">✓ 送出答案 (${ans})</button>
        </div>
      ` : `
        <div class="keypad-grid">
          ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="key-btn" data-action="key-num" data-val="${n}">${n}</button>`).join('')}
          <button class="key-btn del" data-action="key-del">⌫</button>
          <button class="key-btn" data-action="key-num" data-val="0">0</button>
          <button class="key-btn ok" data-action="key-ok">OK</button>
        </div>
      `}
    `;
    if (game.useHandwritingInput) initCanvasDraw('');
  }

  // 2. CLOCK MODULE
  function buildClockSVG(h, m, showHelp) {
    const minAngle = m * 6;
    const hourAngle = ((h % 12) + m / 60) * 30;
    let marks = '';
    for (let i = 1; i <= 12; i++) {
      const ang = (i * 30 - 90) * Math.PI / 180;
      const nx = 150 + Math.cos(ang) * 96;
      const ny = 150 + Math.sin(ang) * 96;
      marks += `<text x="${nx}" y="${ny}" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="900" fill="#2D3436">${i}</text>`;
      if (showHelp) {
        const mx = 150 + Math.cos(ang) * 126;
        const my = 150 + Math.sin(ang) * 126;
        const minLabel = String((i * 5) % 60).padStart(2, '0');
        marks += `<circle cx="${mx}" cy="${my}" r="11" fill="#FFEAA7" stroke="#FDCB6E" stroke-width="1.5"/>`;
        marks += `<text x="${mx}" y="${my}" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="900" fill="#B36B00">${minLabel}</text>`;
      }
    }
    return `
      <svg viewBox="0 0 300 300" style="width:100%; height:100%;">
        <circle cx="62" cy="52" r="28" fill="#A3CB38" stroke="#6AB04C" stroke-width="4"/>
        <circle cx="238" cy="52" r="28" fill="#A3CB38" stroke="#6AB04C" stroke-width="4"/>
        <circle cx="150" cy="155" r="134" fill="#54A0FF" stroke="#2E86DE" stroke-width="5"/>
        <circle cx="150" cy="155" r="114" fill="#FFFFFF"/>
        <g transform="translate(0, 5)">
          ${marks}
          <line x1="150" y1="150" x2="150" y2="54" stroke="#0984E3" stroke-width="6" stroke-linecap="round" transform="rotate(${minAngle} 150 150)"/>
          <line x1="150" y1="150" x2="150" y2="86" stroke="#FF6B6B" stroke-width="9" stroke-linecap="round" transform="rotate(${hourAngle} 150 150)"/>
          <circle cx="150" cy="150" r="8" fill="#2D3436"/>
        </g>
      </svg>
    `;
  }

  let hwMetrics = { points: 0, minX: 9999, maxX: 0, minY: 9999, maxY: 0 };
  function initCanvasDraw(watermark) {
    hwMetrics = { points: 0, minX: 9999, maxX: 0, minY: 9999, maxY: 0 };
    const canvas = document.getElementById('hw-canvas');
    if (!canvas) return;
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = Math.max(280, rect.width);
    canvas.height = Math.max(180, rect.height);
    const ctx = canvas.getContext('2d');

    ctx.strokeStyle = '#FFD6E5';
    ctx.lineWidth = 2;
    [45, 95, 145, 185].forEach(y => {
      ctx.beginPath();
      ctx.moveTo(16, y);
      ctx.lineTo(canvas.width - 16, y);
      ctx.stroke();
    });

    if (watermark) {
      ctx.fillStyle = 'rgba(130, 140, 160, 0.25)';
      ctx.font = '900 72px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(watermark, canvas.width / 2, canvas.height / 2 + 4);
    }

    let drawing = false;
    function getPos(e) {
      const r = canvas.getBoundingClientRect();
      const pt = e.touches ? e.touches[0] : e;
      return { x: pt.clientX - r.left, y: pt.clientY - r.top };
    }

    function recordPt(p) {
      hwMetrics.points++;
      if (p.x < hwMetrics.minX) hwMetrics.minX = p.x;
      if (p.x > hwMetrics.maxX) hwMetrics.maxX = p.x;
      if (p.y < hwMetrics.minY) hwMetrics.minY = p.y;
      if (p.y > hwMetrics.maxY) hwMetrics.maxY = p.y;
    }

    const start = (e) => {
      e.preventDefault();
      drawing = true;
      const p = getPos(e);
      recordPt(p);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.strokeStyle = '#2D3436';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    };
    const move = (e) => {
      if (!drawing) return;
      e.preventDefault();
      const p = getPos(e);
      recordPt(p);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    };
    const end = () => { drawing = false; };

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', end);
  }
